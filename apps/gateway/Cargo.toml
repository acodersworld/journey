[package]
name = "journey-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
h2 = "0.4"
futures-util = "0.3"
http = "1"
journey-websocket = { path = "../../crates/journey-websocket" }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
