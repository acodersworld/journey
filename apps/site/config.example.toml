# Copy to a private TOML file and select it with JOURNEY_CONFIG.

[site]
bind = "127.0.0.1:8080"
database_path = "./journey-site.sqlite3"
session_ttl_seconds = 604800
whatsapp_preview_image_ttl_seconds = 10
max_media_upload_bytes = 2147483648

[storage]
transport = "h2c"
h2c_address = "127.0.0.1:8081"
websocket_bind = "127.0.0.1:8081"
initial_window_size = 524288
initial_connection_window_size = 4194304

[logging]
level = "info"
