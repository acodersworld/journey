[package]
name = "journey-site"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
h2 = "0.4"
http = "1"
journey-websocket = { path = "../../crates/journey-websocket" }
jiff = "0.2"
libc = "0.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite = "0.27"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
