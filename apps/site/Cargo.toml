[package]
name = "journey-site"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
h2 = "0.4"
http = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
