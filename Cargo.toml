[workspace]
members = [
    ".",
    "apps/gateway",
    "apps/home",
    "apps/site",
    "apps/storage",
    "crates/journey-logging",
    "crates/journey-websocket",
    "crates/journey-storage",
]
resolver = "2"

[package]
name = "journey-h2-duplex"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
