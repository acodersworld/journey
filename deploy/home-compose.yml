services:
  home:
    image: ${JOURNEY_IMAGE:?set JOURNEY_IMAGE to the tested image tag}
    command: ["/usr/local/bin/home"]
    env_file:
      - ./home.env
    environment:
      HOME_WEBSOCKET_URL: wss://${JOURNEY_TEST_DOMAIN:?set JOURNEY_TEST_DOMAIN}/internal/storage
      HOME_CA_CERT: /run/journey/tls/test-ca.crt
      HOME_FIXTURES_DIR: /var/lib/journey/fixtures
      HOME_UPLOADS_DIR: /var/lib/journey/uploads
    volumes:
      - ./tls/test-ca.crt:/run/journey/tls/test-ca.crt:ro
      - ${HOME_FIXTURES_DIR:?set HOME_FIXTURES_DIR}:/var/lib/journey/fixtures:ro
      - ${HOME_UPLOADS_DIR:?set HOME_UPLOADS_DIR}:/var/lib/journey/uploads:rw
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 256m
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
