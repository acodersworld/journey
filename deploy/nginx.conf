worker_processes 1;

events {
    worker_connections 256;
}

http {
    log_format journey_access escape=json '$time_iso8601 method=$request_method status=$status request_time=$request_time';
    access_log /dev/stdout journey_access;
    # Nginx error messages can include the original request line and share secrets.
    error_log /dev/null;
    sendfile on;
    client_max_body_size 2g;
    client_body_timeout 1h;
    send_timeout 1h;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        server_name _;

        location = /internal/storage {
            set $journey_site_storage site:8081;
            proxy_pass http://$journey_site_storage;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Journey-Storage-Secret $http_x_journey_storage_secret;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location / {
            set $journey_site_http site:8080;
            proxy_pass http://$journey_site_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
