services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - gateway
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    mem_limit: 64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"

  gateway:
    image: ${JOURNEY_IMAGE:?set JOURNEY_IMAGE to the tested image tag}
    expose:
      - "8080"
      - "9000"
    env_file:
      - ./gateway.env
    environment:
      GATEWAY_BIND: 0.0.0.0:8080
      GATEWAY_WEBSOCKET_BIND: 0.0.0.0:9000
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    mem_limit: 192m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
