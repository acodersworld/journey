services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - site
    ports:
      - "${SITE_LAN_IP:?set SITE_LAN_IP}:80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m,uid=101,gid=101,mode=0755
      - /var/run:size=1m,uid=101,gid=101,mode=0755
      - /tmp:size=8m,mode=1777
    user: "101:101"
    mem_limit: 64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"

  site:
    image: ${JOURNEY_IMAGE:?set JOURNEY_IMAGE to the built image tag}
    command:
      - /usr/local/bin/journey-site
      - serve
    environment:
      JOURNEY_CONFIG: /etc/journey/site.toml
    expose:
      - "8080"
      - "8081"
    volumes:
      - ./site.toml:/etc/journey/site.toml:ro,Z
      - site-data:/var/lib/journey/site
      - ${JOURNEY_IMPORT_DIR:?set JOURNEY_IMPORT_DIR}:/imports:ro
    read_only: true
    tmpfs:
      - /run/journey-site:size=1m,uid=65532,gid=65532,mode=0700
      - /tmp:size=8m,uid=65532,gid=65532,mode=0700
    mem_limit: 512m
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"

volumes:
  site-data:
