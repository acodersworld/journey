[package]
name = "journey-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
h2 = "0.4"
http = "1"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
jpeg-decoder = "0.3"
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
