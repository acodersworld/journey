services:
  home:
    build: .
    command: ["/usr/local/bin/home"]
    environment:
      HOME_BIND: 0.0.0.0:9000
    expose:
      - "9000"

  gateway:
    build: .
    environment:
      GATEWAY_BIND: 0.0.0.0:8080
      HOME_WEBSOCKET_URL: ws://home:9000
    depends_on:
      - home
    ports:
      - "8080:8080"
